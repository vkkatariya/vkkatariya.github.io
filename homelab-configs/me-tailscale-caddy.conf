# /me Tailscale gate — Caddy reference configuration
# Serve the static portfolio (or private /me app) only to clients on the Tailnet.
# Place this snippet in Caddy's config on athena and reload Caddy.
# The public Vercel deployment at vishalkatariya.dev must never include /me content.

# --- recommended: Caddy remote_ip matcher ---
# Any client whose source IP is NOT inside the Tailscale IPv4 CGNAT range
# (100.64.0.0/10) gets a 403 before the request reaches the upstream.

me.auxois-wyrm.ts.net {
    @not_tailscale {
        not remote_ip 100.64.0.0/10
    }
    respond @not_tailscale "Access denied — Tailscale required" 403

    # Upstream: static prototype served from the athena homelab.
    # Bind the upstream container/service to 127.0.0.1 so it is not reachable
    # directly from the public internet.
    reverse_proxy localhost:8900
}

# --- alternative: bind the upstream to the Tailscale IP only ---
# If you prefer to skip the Caddy remote_ip matcher, make sure the static
# server has no listening socket on 0.0.0.0 or the public NIC:
#
#     python3 -m http.server 8900 --bind "$(tailscale ip -4)"
#
# Then reverse_proxy to that Tailscale IP instead of 127.0.0.1.
# The Caddy reverse-proxy + automatic HTTPS path is still recommended for
# production because it gives you a stable hostname and TLS certificate.

# --- hard constraints ---
# - NO page-level passwords.
# - NO client-side auth checks (JavaScript "login" forms, JWT in localStorage, etc.).
# - NO /me content in the public Vercel build.
# - All athena containers bind to 127.0.0.1 unless they explicitly need Tailscale.
