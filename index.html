<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vishal Katariya · Portfolio</title>
  <link rel="canonical" href="/prototypes/portfolio-combined" />
  <meta name="description" content="Vishal Katariya — Personal portfolio" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300;1,400;1,600&family=Space+Grotesk:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script>
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #080808;
      color: #f0f0f0;
      font-family: 'Space Grotesk', system-ui, sans-serif;
      overflow: hidden;
    }

    /* dot-grid background — NothingOS aesthetic */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle, rgba(240,240,240,0.055) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── page-level fade-out overlay ── */
    #fadeout {
      position: fixed;
      inset: 0;
      background: #080808;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 400ms ease;
    }
    #fadeout.active { opacity: 1; }

    /* ── center stage ── */
    .stage {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
    }

    /* ── glass card ── */
    .glass-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 56px 44px;
      border-radius: 24px;
      background: rgba(240,240,240,0.04);
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      border: 1px solid rgba(240,240,240,0.1);
      box-shadow: 0 0 0 1px rgba(0,0,0,0.4), 0 32px 64px rgba(0,0,0,0.5);
      opacity: 0;
      transform: translateY(12px) scale(0.98);
      animation: card-in 600ms cubic-bezier(0.22, 0.61, 0.36, 1) 80ms forwards;
    }

    /* ── VK monogram ── */
    .monogram {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(88px, 14vw, 128px);
      line-height: 1;
      letter-spacing: -3px;
      color: #f0f0f0;
      opacity: 0;
      animation: monogram-in 700ms cubic-bezier(0.22, 0.61, 0.36, 1) 200ms forwards;
      user-select: none;
    }

    /* ── divider ── */
    .divider {
      width: 32px;
      height: 1px;
      background: rgba(240,240,240,0.18);
      margin: 20px 0 18px;
      opacity: 0;
      animation: fade-in 400ms ease 600ms forwards;
    }

    /* ── name ── */
    .name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(240,240,240,0.55);
      opacity: 0;
      transform: translateY(6px);
      animation: name-in 500ms cubic-bezier(0.22, 0.61, 0.36, 1) 620ms forwards;
      white-space: nowrap;
    }

    /* ── tagline ── */
    .tagline {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #3ddc84;
      margin-top: 6px;
      opacity: 0;
      animation: fade-in 400ms ease 800ms forwards;
    }

    /* ── progress bar ── */
    .progress-wrap {
      margin-top: 36px;
      width: 100%;
      height: 1px;
      background: rgba(240,240,240,0.08);
      border-radius: 1px;
      overflow: hidden;
      opacity: 0;
      animation: fade-in 200ms ease 900ms forwards;
    }
    .progress-bar {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #3ddc84, #00D4AA);
      border-radius: 1px;
      animation: progress-fill 1000ms cubic-bezier(0.4, 0, 0.2, 1) 1000ms forwards;
    }

    /* ── fallback link ── */
    .enter-link {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(240,240,240,0.3);
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 100px;
      border: 1px solid rgba(240,240,240,0.08);
      cursor: pointer;
      opacity: 0;
      animation: fade-in 400ms ease 1200ms forwards;
      transition: color 200ms ease, border-color 200ms ease;
      white-space: nowrap;
      z-index: 1;
    }
    .enter-link:hover {
      color: rgba(240,240,240,0.6);
      border-color: rgba(240,240,240,0.2);
    }
    .enter-link:focus-visible {
      outline: 2px solid #3ddc84;
      outline-offset: 3px;
    }

    /* ── keyframes ── */
    @keyframes card-in {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes monogram-in {
      0%  { opacity: 0; transform: scale(0.93); filter: blur(4px); }
      60% { filter: blur(0); }
      100%{ opacity: 1; transform: scale(1); filter: blur(0); }
    }
    @keyframes name-in {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fade-in {
      to { opacity: 1; }
    }
    @keyframes progress-fill {
      to { width: 100%; }
    }

    /* ── reduced motion: skip all animation, redirect instantly ── */
    @media (prefers-reduced-motion: reduce) {
      .glass-card, .monogram, .divider, .name, .tagline,
      .progress-wrap, .progress-bar, .enter-link {
        animation: none;
        opacity: 1;
        transform: none;
        filter: none;
      }
      .progress-bar { width: 100%; }
    }
  </style>
</head>
<body>
  <div id="fadeout"></div>

  <main class="stage">
    <div class="glass-card">
      <span class="monogram" aria-label="VK">VK</span>
      <div class="divider" aria-hidden="true"></div>
      <span class="name">Vishal Katariya</span>
      <span class="tagline">Portfolio</span>
      <div class="progress-wrap" role="progressbar" aria-label="Loading">
        <div class="progress-bar"></div>
      </div>
    </div>
  </main>

  <a class="enter-link" href="/prototypes/portfolio-combined" tabindex="0">Enter Portfolio →</a>

  <script>
    const DEST = '/prototypes/portfolio-combined';
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (reduced) {
      window.location.replace(DEST);
    } else {
      // fade-out at 2150ms, navigate at 2550ms
      setTimeout(function () {
        document.getElementById('fadeout').classList.add('active');
      }, 2150);
      setTimeout(function () {
        window.location.replace(DEST);
      }, 2550);
    }
  </script>
</body>
</html>
