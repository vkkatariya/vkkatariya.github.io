name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'prototypes/**'
      - 'lib/**'
      - 'assets/**'
      - 'CNAME'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Pre-deploy HTML validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - name: Lint HTML prototypes
        run: npm run lint:html

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Add .nojekyll (bypass Jekyll processing)
        run: touch .nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for Pages propagation
        run: sleep 30

      - name: Check root URL returns HTTP 200
        run: |
          STATUS=$(curl -sL -o /dev/null -w '%{http_code}' 'https://vkkatariya.github.io/')
          if [ "$STATUS" != "200" ]; then
            echo "::error::Root URL returned HTTP $STATUS (expected 200)"
            exit 1
          fi
          echo "✓ Root URL HTTP 200"

      - name: Verify served by GitHub (not Vercel)
        run: |
          SERVER=$(curl -sIL 'https://vkkatariya.github.io/' | grep -i '^server:' | head -1 | tr -d '\r')
          echo "Server: $SERVER"
          if echo "$SERVER" | grep -qi 'vercel'; then
            echo "::error::GitHub Pages is being served by Vercel (CNAME redirect chain active). See L-058."
            exit 1
          fi
          if echo "$SERVER" | grep -qi 'github'; then
            echo "✓ Served by GitHub.com (correct)"
          else
            echo "::warning::Unexpected server header: $SERVER"
          fi

      - name: Fetch SPA content once
        run: |
          curl -sL 'https://vkkatariya.github.io/prototypes/portfolio-combined.html' > /tmp/spa.html
          BYTES=$(wc -c < /tmp/spa.html)
          echo "Fetched $BYTES bytes"
          if [ "$BYTES" -lt 100000 ]; then
            echo "::error::SPA suspiciously small ($BYTES bytes, expected >100KB)"
            exit 1
          fi
          echo "✓ SPA content size: $BYTES bytes"

      - name: Check SPA page sections present
        run: |
          fail=0
          check() {
            grep -q "$1" /tmp/spa.html \
              && echo "✓ $2" \
              || { echo "::error::Missing $2"; fail=1; }
          }
          check 'id="pg-home"'            "pg-home section"
          check 'id="pg-projects"'        "pg-projects section"
          check 'id="pg-roadmap"'         "pg-roadmap section"
          check 'id="pg-about"'           "pg-about section"
          check 'id="themeBtn"'           "theme toggle button"
          check 'id="langBtn"'            "language toggle button"
          check 'id="navMenuBtn"'         "mobile menu button"
          check 'id="modal-overlay"'      "roadmap modal"
          check 'id="shared-nav"'         "shared navigation"
          exit $fail

      - name: Check widget content
        run: |
          fail=0
          check() {
            grep -q "$1" /tmp/spa.html \
              && echo "✓ $2" \
              || { echo "::error::Missing $2"; fail=1; }
          }
          check 'HERMES OAUTH'        "HERMES OAUTH widget"
          check 'GITHUB ACTIVITY'     "GITHUB ACTIVITY widget"
          check 'topics-grid'         "CS roadmap topics grid"
          check 'careers-grid'        "CS roadmap careers grid"
          exit $fail

      - name: Check analytics scripts
        run: |
          fail=0
          check() {
            grep -q "$1" /tmp/spa.html \
              && echo "✓ $2" \
              || { echo "::error::Missing $2"; fail=1; }
          }
          check 'window.siq'                          "Speed Insights queue initializer"
          check '/_vercel/speed-insights/script.js'   "Speed Insights script reference"
          check 'window.vaq'                          "Web Analytics queue initializer"
          check '/_vercel/insights/script.js'         "Web Analytics script reference"
          exit $fail
