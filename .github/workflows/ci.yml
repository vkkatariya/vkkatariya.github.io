name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # Pinned to ubuntu-24.04: `ubuntu-latest` now resolves to 26.04, which Playwright 1.56 cannot install
  # chromium on ("does not support chromium on ubuntu26.04-x64"). Unpin when Playwright is upgraded.
  lint-html:
    name: HTML Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Lint HTML prototypes
        run: npm run lint:html

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-24.04
    needs: lint-html
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npm test
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Phase 1 (SvelteKit scaffold in web/, API in api/) is not started. Add its typecheck/lint/build jobs
  # when the scaffold lands. They were removed because `hashFiles()` is not allowed in a job-level `if:`,
  # which made GitHub reject this whole file ("workflow file issue") so no CI ran at all.
